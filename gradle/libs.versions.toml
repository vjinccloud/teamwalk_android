[versions]
# Android
agp = "8.9.2"
kotlin = "2.0.21"

# PatternLock 現在Jcenter已經不使用 參考 https://jitpack.io/#aritraroy/PatternLockView 找最新的Tag
patternlockview = "a90b0d4bf0"
# PatternLock 現在Jcenter已經不使用 參考 https://jitpack.io/#ChenLittlePing/RecyclerCoverFlow 找最新的Tag
recyclercoverflow = "recycler-coverflow-1.0.6"

# AndroidX Core
coreKtx = "1.16.0"
appcompat = "1.7.1"
androidxActivity = "1.10.1"
androidxFragment = "1.8.8"
androidxLifecycle = "2.9.1"

# AndroidX UI
material = "1.12.0"
activity = "1.10.1"
cardview = "1.0.0"
constraintlayout = "2.2.1"
recyclerview = "1.4.0"
webkit = "1.14.0"
browser = "1.8.0"

# Firebase
firebase_bom = "33.11.0"
firebase_crashlytics = "3.0.4"

# Google Play Services
gms_fitness = "21.2.0"
gms_auth = "21.3.0"
google_services = "4.4.3"
credentialsPlayServicesAuth = "1.5.0"
credentials = "1.5.0"
googleid = "1.1.1"
connectClient = "1.1.0-rc02"

# Google Play Core
play_review = "2.0.2"
play_core_common = "2.0.4"

# Network
okhttp_logging = "4.12.0"
retrofit = "2.9.0"
gson = "2.11.0"
converterGson = "2.9.0"

# Image Loading
glide = "4.15.1"

# Security
secure_preference = "0.5.0"

# Facebook
facebook_sdk = "18.0.3"

# Tools
desugar = "2.1.5"

# DI
koin-bom = "4.0.3"

# Log
timberVersion = "5.0.1"

# Testing
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"

[libraries]
patternlockview = { module = "com.github.aritraroy:PatternLockView", version.ref = "patternlockview" }
recyclercoverflow = { module = "com.github.ChenLittlePing:RecyclerCoverFlow", version.ref = "recyclercoverflow" }

androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "androidxActivity" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "androidxFragment" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }

material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }

firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase_bom" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }

gms-fitness = { module = "com.google.android.gms:play-services-fitness", version.ref = "gms_fitness" }
gms-auth = { module = "com.google.android.gms:play-services-auth", version.ref = "gms_auth" }
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "credentials" }
androidx-credentials-play-services-auth = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "credentialsPlayServicesAuth" }
googleid = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleid" }
androidx-connect-client = { module = "androidx.health.connect:connect-client", version.ref = "connectClient" }

androidx-cardview = { module = "androidx.cardview:cardview", version.ref = "cardview" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "browser" }

glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp_logging" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
secure-preference = { module = "online.devliving:securedpreferencestore", version.ref = "secure_preference" }
converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "converterGson" }

desugar = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar" }

play-review = { module = "com.google.android.play:review", version.ref = "play_review" }
play-core-common = { module = "com.google.android.play:core-common", version.ref = "play_core_common" }
play-review-ktx = { group = "com.google.android.play", name = "review-ktx", version.ref = "play_review" }

facebook-sdk = { module = "com.facebook.android:facebook-android-sdk", version.ref = "facebook_sdk" }

koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin-bom" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-android = { module = "io.insert-koin:koin-android" }

jakewharton-timber = { module = "com.jakewharton.timber:timber", version.ref = "timberVersion" }
[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
google_services = { id = "com.google.gms.google-services", version.ref = "google_services" }
firebase_crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebase_crashlytics" }

