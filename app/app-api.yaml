      operationId: saveLandingInfo
      parameters:
        - name: authorization
          in: header
          description: 登入者JWT
          required: true
          type: string
        - name: post_info
          in: body
          required: true
          schema:
            $ref: '#/definitions/LandingPostRequest'
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/GeneralResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/GeneralResponse'
        '500':
          description: Internal server error occurred
  
