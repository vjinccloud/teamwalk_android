swagger: '2.0'
info:
  title: '台灣人壽-Teamwalk APP API'
  version: '1.0'
host: teamwalk.mutron.com.tw
basePath: /fe-api
schemes:
  - https
paths:
  /mock/csso:
    post:
      produces:
        - application/x-www-form-urlencoded
      summary: "模擬CSSO"
      tags:
        - APP
      operationId: cssoLogin
      parameters:
        - name: SYS_ID
          type: string
          in: query
          required: true
        - name: appl_id
          type: string
          in: query
          required: true
        - name: appl_pwd
          type: string
          in: query
          required: true
        - name: service
          type: string
          in: query
          required: true

      responses:
        '302':
          description: Success(會帶入ticket參數在網址後)
          schema:
            type: string
            example: 'teamwalk://loginsuccess?ticket=xxxxx'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/GeneralResponse'
        '500':
          description: Internal server error occurred
  /login:
    post:
      produces:
        - application/json
      summary: "使用者登入"
      tags:
        - APP
      operationId: login
      parameters:
        - name: post_info
          in: body
          required: true
          schema:
            $ref: '#/definitions/LoginPostRequest'
      responses:
        '200':
          description: Success
          schema:
            $ref: '#/definitions/LoginPostResponse'
        '400':
          description: Bad Request
          schema:
            $ref: '#/definitions/GeneralResponse'
        '500':
          description: Internal server error occurred
  /landing:
    post:
      produces:
